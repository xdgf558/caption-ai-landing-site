name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Station Cat public queries and isolated Worker permissions
        run: npm run test:redesign:public

      - name: Verify shared Station Cat player sessions and legacy audio lifecycle
        run: npm run test:redesign:player

      - name: Run tests
        run: npm test

      - name: Verify music upload validation and quota guards
        run: npm run test:music:uploads

      - name: Verify Station Cat media uploads, immutable versions and Access permissions
        run: npm run test:redesign:uploads

      - name: Verify Station Cat content publishing, revisions and scheduled recovery
        run: npm run test:redesign:content-admin

      - name: Verify music admin client contracts
        run: npm run test:music:admin-ui

      - name: Build isolated music player preview
        run: npm run build:music:player-preview

      - name: Verify Station Cat redesign routes and isolated preview
        run: |
          npm run test:redesign:routes
          npm run test:redesign:home
          npm run build:redesign:preview

      - name: Verify isolated music Workers D1 and R2 runtime
        run: npm run test:music:runtime

      - name: Verify additive Station Cat models and isolated D1 migration rollback
        run: npm run test:redesign:model

      - name: Verify isolated native authentication and deletion recovery
        run: node --test scripts/test-mobile-probe-diagnostics.mjs scripts/test-mobile-crash-preparation.mjs && npm run test:mobile:auth && npm run test:mobile:music && npm run test:mobile:library && npm run test:mobile:lifecycle && npm run test:mobile:r2

      - name: Verify closed native production profile and migration rehearsal
        run: npm run test:mobile:production

      - name: Verify account deletion schema inventory and isolation hazards
        run: python3 scripts/test-account-deletion-audit.py && python3 scripts/test-comment-author-migration.py

      - name: Verify reproducible Cat Life motion bundle
        run: |
          npm ci --prefix experiments/orange-cat-preview
          npm test --prefix experiments/orange-cat-preview
          npm run build:game --prefix experiments/orange-cat-preview
          git diff --exit-code -- public/games/cat-life/src/vendor/cat-motion

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

      - name: Build
        run: npm run build
        env:
          ALLOW_EMPTY_SERIAL_CONTENT: "1"

      - name: Verify product landing themes and locale routes
        run: node scripts/test-product-night.mjs

      - name: Verify brand and game launch package and closed legacy website content
        run: |
          npm run build:station:first-launch
          npm run test:station:first-launch

      - name: Verify integrated Station Cat core acceptance fixture and HTTP boundaries
        run: npm run test:redesign:acceptance

      - name: Verify closed release candidate and isolated backup-compatible rollback
        run: |
          npm run test:redesign:release
          npm run check:redesign:release

      - name: Verify registered Campaigns, QR destinations and attribution contexts
        run: npm run test:redesign:campaigns

      - name: Verify Station Cat consent, confirmed events, dedupe and controlled retention
        run: npm run test:redesign:events

      - name: Verify Station Cat report cohorts, provenance and controlled aggregate retention
        run: npm run test:redesign:reports

      - name: Verify isolated legacy exits, preserved services and search routing
        run: |
          npm run test:redesign:migration
          npm run rehearse:redesign:routes

      - name: Verify isolated Station Cat music pages against the built Astro shell
        run: npm run test:redesign:music

      - name: Verify Station Cat release platforms and nonblocking fallbacks
        run: npm run test:redesign:platforms

      - name: Verify Station Cat click-to-play clips and media teardown
        run: |
          node scripts/build-station-clip-home-preview.mjs
          npm run test:redesign:clips

      - name: Verify Station Cat game pages and protected save handoff
        run: npm run test:redesign:games

      - name: Verify Station Cat game instances, media handoff and message identity
        run: |
          npm run test:redesign:game-session
          npm run build:redesign:game-session

      - name: Verify closed production music candidate assets
        run: node --test scripts/test-music-production-assets.mjs

      - name: Verify Station Cat membership and existing reader service boundaries
        run: |
          npm run build:redesign:member
          npm run test:redesign:member

      - name: Verify isolated music staging package
        run: |
          node scripts/build-music-staging-assets.mjs
          node scripts/check-music-staging-assets.mjs

      - name: Run article browser tests
        run: npm run test:browser:articles
        env:
          ALLOW_EMPTY_SERIAL_CONTENT: "1"

      - name: Run payment UI browser tests
        run: npm run test:browser:payments
        env:
          ALLOW_EMPTY_SERIAL_CONTENT: "1"

      - name: Run music admin browser tests
        run: npx playwright test --config playwright.music-admin.config.mjs

      - name: Verify explicit music activation presentation
        run: |
          npm run build:music:active
          PUBLIC_MUSIC_ENTRY_ENABLED=true npx playwright test --config playwright.payments.config.mjs vip-membership.spec.mjs
        env:
          ALLOW_EMPTY_SERIAL_CONTENT: "1"
