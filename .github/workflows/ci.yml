name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify music upload validation and quota guards
        run: npm run test:music:uploads

      - name: Verify isolated music Workers D1 and R2 runtime
        run: npm run test:music:runtime

      - name: Verify reproducible Cat Life motion bundle
        run: |
          npm ci --prefix experiments/orange-cat-preview
          npm test --prefix experiments/orange-cat-preview
          npm run build:game --prefix experiments/orange-cat-preview
          git diff --exit-code -- public/games/cat-life/src/vendor/cat-motion

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

      - name: Build
        run: npm run build
        env:
          ALLOW_EMPTY_SERIAL_CONTENT: "1"

      - name: Run article browser tests
        run: npm run test:browser:articles
        env:
          ALLOW_EMPTY_SERIAL_CONTENT: "1"

      - name: Run payment UI browser tests
        run: npm run test:browser:payments
        env:
          ALLOW_EMPTY_SERIAL_CONTENT: "1"
