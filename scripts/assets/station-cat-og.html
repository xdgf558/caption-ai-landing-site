<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1200, initial-scale=1">
    <title>Station Cat social preview</title>
    <style>
      * { box-sizing: border-box; letter-spacing: 0; }
      html, body { height: 630px; margin: 0; overflow: hidden; width: 1200px; }
      body {
        background-color: #fbf6ec;
        background-image:
          linear-gradient(#e7ddce 1px, transparent 1px),
          linear-gradient(90deg, #e7ddce 1px, transparent 1px);
        background-size: 35px 35px;
        color: #241f1a;
        font-family: Arial, sans-serif;
      }
      main {
        align-items: center;
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr) 218px;
        gap: 38px;
        height: 100%;
        padding: 72px 88px 72px 76px;
      }
      .rail { align-self: stretch; background: #1f5b4d; }
      .kicker { color: #1f5b4d; font-size: 26px; font-weight: 700; margin: 0 0 30px; }
      h1 { font-family: Georgia, serif; font-size: 92px; line-height: 1; margin: 0; }
      .rule { background: #241f1a; height: 4px; margin: 32px 0 40px; width: 686px; }
      .description { color: #4e4942; font-size: 34px; line-height: 1.42; margin: 0; }
      .url { background: #f1a54b; display: inline-block; font-size: 23px; font-weight: 700; margin-top: 42px; padding: 15px 28px; }
      .mark {
        align-self: start;
        background: #1f5b4d;
        border-radius: 44px;
        height: 218px;
        position: relative;
        width: 218px;
      }
      .mark::after { background: #f1a54b; border-radius: 50%; bottom: 18px; content: ''; height: 30px; position: absolute; right: 18px; width: 30px; }
      .letters { color: #fffaf4; display: flex; font-family: Arial Black, Arial, sans-serif; font-size: 82px; font-weight: 900; gap: 4px; justify-content: center; line-height: 218px; }
    </style>
  </head>
  <body>
    <main>
      <div class="rail"></div>
      <section>
        <p class="kicker">INDEPENDENT CREATIVE STATION</p>
        <h1>STATION CAT</h1>
        <div class="rule"></div>
        <p class="description">Independent apps, serial fiction,<br>and public signals.</p>
        <div class="url">wwwstationcat.org</div>
      </section>
      <div class="mark" aria-hidden="true"><span class="letters">SC</span></div>
    </main>
  </body>
</html>
