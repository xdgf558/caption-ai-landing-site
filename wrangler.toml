name = "caption-ai-landing-site"
compatibility_date = "2026-05-17"
main = "src/worker.js"
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ADMIN_ALLOWED_EMAILS = "brodstem@protonmail.com"
CF_ACCESS_TEAM_DOMAIN = "misty-limit-82d5.cloudflareaccess.com"
CF_ACCESS_AUD = "9b7bb7ce53bf630feea9b85e8911b34fa4647c7146b6c81d9958695c2c5fea73"
READER_EMAIL_FROM = "noreply@wwwstationcat.org"
READER_EMAIL_FROM_NAME = "Station Cat"
NOVEL_TRANSLATION_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
NOVEL_TRANSLATION_AUTO_SYNC = "1"
SIGNAL_BRIEF_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
SIGNAL_BRIEF_FALLBACK_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
SIGNAL_BRIEF_DEEPSEEK_ENABLED = "1"
SIGNAL_BRIEF_DEEPSEEK_MODEL = "deepseek-v4-pro"

[assets]
directory = "./dist"
binding = "ASSETS"

[ai]
binding = "AI"

[triggers]
crons = ["17 * * * *"]

[[queues.producers]]
queue = "station-cat-signal-collection"
binding = "SIGNAL_COLLECTION_QUEUE"

[[queues.consumers]]
queue = "station-cat-signal-collection"
dead_letter_queue = "station-cat-signal-collection-dlq"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
# refreshSignalCollectionRun uses a read/aggregate/update sequence; keep this at 1 unless that code becomes concurrency-safe.
max_concurrency = 1

[[queues.consumers]]
queue = "station-cat-signal-collection-dlq"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
max_concurrency = 1

[[d1_databases]]
binding = "WAITLIST_DB"
database_name = "station-cat-waitlist"
database_id = "c4a8cb1a-6a94-4e8f-a6fb-a734afafca63"

[[r2_buckets]]
binding = "DOWNLOADS_BUCKET"
bucket_name = "station-cat-downloads"

[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "station-cat-content"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@wwwstationcat.org"]

[[routes]]
pattern = "wwwstationcat.org"
custom_domain = true
